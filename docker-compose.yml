# As credenciais e chaves de API vêm do arquivo .env (não versionado — veja
# .env.example). O Docker Compose lê o .env sozinho, desde que ele esteja
# nesta mesma pasta.
services:
  db:
    image: postgres:16-alpine
    container_name: ask-ia-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-askia_db}
      POSTGRES_USER: ${DB_USER:-askia}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-askia123}
    ports:
      - "5432:5432"
    volumes:
      - askia_db_data:/var/lib/postgresql/data
      # Scripts SQL rodados pelo PRÓPRIO Postgres na primeira subida (banco
      # vazio), em ordem alfabética. Não roda de novo em subidas seguintes:
      # para recriar o schema do zero, apague o volume askia_db_data.
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-askia} -d ${DB_NAME:-askia_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: ask-ia-backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-askia_db}
      DB_USER: ${DB_USER:-askia}
      DB_PASSWORD: ${DB_PASSWORD:-askia123}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      # Vazio = endereço padrão da OpenAI. Groq: https://api.groq.com/openai/v1
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-onboarding@resend.dev}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: ask-ia-frontend
    restart: unless-stopped
    environment:
      PORT: 4000
    ports:
      - "4200:4000"
    depends_on:
      - backend

volumes:
  askia_db_data:
