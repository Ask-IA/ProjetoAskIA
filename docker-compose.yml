services:
  db:
    image: postgres:16-alpine
    container_name: ask-ia-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: askia_db
      POSTGRES_USER: askia
      POSTGRES_PASSWORD: askia123
    ports:
      - "5432:5432"
    volumes:
      - askia_db_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U askia -d askia_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: ask-ia-backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: askia_db
      DB_USER: askia
      DB_PASSWORD: askia123
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: ask-ia-frontend
    restart: unless-stopped
    environment:
      PORT: 4000
    ports:
      - "4200:4000"
    depends_on:
      - backend

volumes:
  askia_db_data: