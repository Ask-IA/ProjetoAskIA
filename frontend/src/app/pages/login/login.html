<!-- src/app/pages/login/login.html -->

<div class="auth-pagina">
  <main class="auth-cartao">
    <a routerLink="/" class="auth-marca" aria-label="Ask.IA, voltar para o início">
      <span class="logo-quadro"><app-icone nome="logo" [tamanho]="20" /></span>
      Ask.IA
    </a>

    <h1 class="auth-titulo">Entrar</h1>
    <p class="auth-sub">Que bom te ver de novo.</p>

    <form id="login-form" class="auth-form" novalidate [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="campo-app">
        <label for="email">E-mail</label>
        <input type="email" id="email" formControlName="email" autocomplete="username" required />
      </div>

      <div class="campo-app">
        <label for="password">Senha</label>
        <!-- campo + botão do "olhinho" (mostrar/ocultar a senha) -->
        <div class="campo-senha">
          <input [type]="mostrarSenha() ? 'text' : 'password'" id="password" formControlName="password"
                 autocomplete="current-password" required />
          <button type="button" class="olhinho" (click)="mostrarSenha.set(!mostrarSenha())"
                  [attr.aria-label]="mostrarSenha() ? 'Ocultar senha' : 'Mostrar senha'"
                  [attr.aria-pressed]="mostrarSenha()">
            <!-- olho riscado = a senha está visível; olho aberto = está oculta -->
            <app-icone [nome]="mostrarSenha() ? 'olho-riscado' : 'olho'" [tamanho]="18" />
          </button>
        </div>
      </div>

      @if (errorMessage()) {
        <p id="error-message" class="msg-erro-app" role="alert">{{ errorMessage() }}</p>
      }

      <button type="submit" class="btn-acento" [disabled]="loading()">{{ loading() ? 'Entrando...' : 'Entrar' }}</button>
    </form>

    <p class="auth-rodape">
      Ainda não tem conta?
      <a routerLink="/cadastro" id="signup-link" class="link-acao">Criar conta grátis</a>
    </p>
  </main>
</div>
