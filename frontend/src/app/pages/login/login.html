<div class="page">
  <main class="login-card">
    <div class="logo">
      <span class="logo-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
          <circle cx="12" cy="12" r="2.2"/>
          <circle cx="4" cy="6" r="1.6"/>
          <circle cx="20" cy="6" r="1.6"/>
          <circle cx="4" cy="18" r="1.6"/>
          <circle cx="20" cy="18" r="1.6"/>
          <line x1="10.3" y1="10.6" x2="5.2" y2="7.2"/>
          <line x1="13.7" y1="10.6" x2="18.8" y2="7.2"/>
          <line x1="10.3" y1="13.4" x2="5.2" y2="16.8"/>
          <line x1="13.7" y1="13.4" x2="18.8" y2="16.8"/>
        </svg>
      </span>
      <span class="logo-text">Ask.IA</span>
    </div>
<form id="login-form" class="login-form" novalidate [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="field">
    <label for="email">Informe o E-mail</label>
    <input type="email" id="email" formControlName="email" autocomplete="username" required />
  </div>

  <div class="field">
    <label for="password">Informe a Senha</label>
    <!-- campo + botão do "olhinho" (mostrar/ocultar a senha) -->
    <div class="campo-senha">
      <input [type]="mostrarSenha ? 'text' : 'password'" id="password" formControlName="password" autocomplete="current-password" required />
      <button type="button" class="olhinho" (click)="mostrarSenha = !mostrarSenha"
              [attr.aria-label]="mostrarSenha ? 'Ocultar senha' : 'Mostrar senha'"
              [attr.aria-pressed]="mostrarSenha">
        @if (mostrarSenha) {
          <!-- olho riscado: a senha está visível, clique para ocultar -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18" aria-hidden="true">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
            <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        } @else {
          <!-- olho aberto: a senha está oculta, clique para mostrar -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18" aria-hidden="true">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        }
      </button>
    </div>
  </div>
  <p id="error-message" class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>

  <button type="submit" class="btn-primary" [disabled]="loading">{{ loading ? 'Entrando...' : 'Entrar' }}</button>

      <p class="signup-text">
        Não possui um login?
        <a routerLink="/cadastro" id="signup-link">Cadastrar</a>
      </p>
    </form>
  </main>
</div>
