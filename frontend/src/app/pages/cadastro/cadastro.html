<div class="page">
  <main class="login-card">
    <div class="logo">
      <span class="logo-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
          stroke-linejoin="round" width="18" height="18">
          <circle cx="12" cy="12" r="2.2" />
          <circle cx="4" cy="6" r="1.6" />
          <circle cx="20" cy="6" r="1.6" />
          <circle cx="4" cy="18" r="1.6" />
          <circle cx="20" cy="18" r="1.6" />
          <line x1="10.3" y1="10.6" x2="5.2" y2="7.2" />
          <line x1="13.7" y1="10.6" x2="18.8" y2="7.2" />
          <line x1="10.3" y1="13.4" x2="5.2" y2="16.8" />
          <line x1="13.7" y1="13.4" x2="18.8" y2="16.8" />
        </svg>
      </span>
      <span class="logo-text">Ask.IA</span>
    </div>

    <h1 class="card-title">Cadastro</h1>

    <form id="cadastro-form" class="login-form" novalidate [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="field">
        <label for="email">Informe um Email</label>
        <input type="email" id="email" formControlName="email" autocomplete="email" required />
      </div>

      <div class="field">
        <label for="name">Informe seu Nome</label>
        <input type="text" id="name" formControlName="name" autocomplete="name" required />
      </div>

      <div class="field">
        <label for="password">Informe a Senha</label>
        <input type="password" id="password" formControlName="password" autocomplete="new-password" required />
      </div>

      <div class="field">
        <label for="confirm-password">Confirme a Senha</label>
        <input type="password" id="confirm-password" formControlName="confirmPassword" autocomplete="new-password"
          required />
      </div>

      <p id="error-message" class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>

      <button type="submit" class="btn-primary" [disabled]="loading">{{ loading ? 'Cadastrando...' : 'Cadastrar'
        }}</button>
      <p class="signup-text">
        Já possui um login?
        <a routerLink="/login" id="login-link">Login</a>
      </p>
    </form>
  </main>

  <button type="button" class="btn-google" id="google-btn">
    <svg class="google-icon" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
      <path fill="#4285F4"
        d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z" />
      <path fill="#34A853"
        d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.85.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z" />
      <path fill="#FBBC05"
        d="M3.97 10.72A5.4 5.4 0 0 1 3.68 9c0-.6.1-1.18.29-1.72V4.95H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.05l3.01-2.33z" />
      <path fill="#EA4335"
        d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z" />
    </svg>
    Continue com google
  </button>
</div>
