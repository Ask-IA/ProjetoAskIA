<!-- "Como funciona": faixa escura com a moldura da marca (data-tema="escuro"
     reaproveita as cores do modo escuro, sem cor fixa no código) -->
<section id="como-funciona" class="secao como-funciona" data-tema="escuro">
  <div class="conteudo-secao">

    <div class="cabeca-secao">
      <span class="sobretitulo">Como funciona</span>
      <h2 class="titulo-landing">O Ask.IA não para na resposta pronta</h2>
      <p class="texto-landing">Ele fecha o ciclo: você pergunta, entende, pratica e revisa o que ainda não fixou.</p>
    </div>

    <ol class="passos">
      @for (passo of passos; track passo.titulo; let i = $index) {
        <li>
          <span class="linha-titulo">
            <span class="numero" aria-hidden="true">{{ i + 1 }}</span>
            <h3>{{ passo.titulo }}</h3>
          </span>
          <p>{{ passo.texto }}</p>
        </li>
      }
    </ol>
  </div>
</section>
