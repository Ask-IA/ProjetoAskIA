<header class="cabecalho">
  <nav class="barra" aria-label="Navegação principal">
    <a href="#inicio" class="marca">
      <span class="logo-quadro"><app-icone nome="logo" [tamanho]="20" /></span>
      Ask.IA
    </a>

    <!-- Computador -->
    <div class="links">
      <a href="#recursos">Recursos</a>
      <a href="#como-funciona">Como funciona</a>
      <a href="#sobre">Sobre</a>
      <span class="acoes">
        <a routerLink="/login" class="btn-tinta">Entrar</a>
        <a routerLink="/cadastro" class="btn-acento">Criar conta grátis</a>
      </span>
    </div>

    <!-- Celular -->
    <div class="acoes-celular">
      <a routerLink="/login" class="btn-tinta">Entrar</a>
      <button type="button" class="btn-icone botao-menu" (click)="alternarMenu()"
              [attr.aria-expanded]="menuAberto()" aria-controls="menu-landing"
              [attr.aria-label]="menuAberto() ? 'Fechar menu' : 'Abrir menu'">
        <app-icone [nome]="menuAberto() ? 'x' : 'menu'" [tamanho]="22" />
      </button>
    </div>
  </nav>

  @if (menuAberto()) {
    <div class="menu-celular" id="menu-landing">
      <a href="#recursos" (click)="fecharMenu()">Recursos</a>
      <a href="#como-funciona" (click)="fecharMenu()">Como funciona</a>
      <a href="#sobre" (click)="fecharMenu()">Sobre</a>
      <a routerLink="/cadastro" class="btn-acento" (click)="fecharMenu()">Criar conta grátis</a>
    </div>
  }
</header>
