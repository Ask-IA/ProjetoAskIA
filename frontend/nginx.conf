# Servidor do frontend do Ask.IA (sem SSR) + proxy para o backend.
# Escuta na porta 4000 para o docker-compose existente ("4200:4000")
# continuar funcionando sem nenhuma alteração.
#
# /api/ e /auth/ são encaminhados para o container do backend (serviço
# "backend" do docker-compose, porta 8080 — nome resolvido pelo DNS interno
# do Docker). Assim o frontend chama caminhos relativos (environment.ts:
# apiUrl vazio) e funciona em QUALQUER domínio público, sem precisar saber
# de antemão a URL do backend — resolve o TODO que existia em environment.ts.
server {
  listen 4000;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Margem extra além do padrão de 60s do nginx: com o retry do Spring AI já
    # afinado para falhar rápido (application.properties), isso é só uma rede
    # de segurança para o caso raro de uma resposta de IA legitimamente lenta.
    proxy_connect_timeout 90s;
    proxy_send_timeout 90s;
    proxy_read_timeout 90s;
  }

  location /auth/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA: rota digitada direto (ex.: /app/ask) cai no index.html
  # e o Angular Router resolve no navegador.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
