# Servidor estático do frontend do Ask.IA (sem SSR).
# Escuta na porta 4000 para o docker-compose existente ("4200:4000")
# continuar funcionando sem nenhuma alteração.
server {
  listen 4000;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: rota digitada direto (ex.: /app/ask) cai no index.html
  # e o Angular Router resolve no navegador.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
