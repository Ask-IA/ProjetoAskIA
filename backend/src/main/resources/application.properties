spring.application.name=IA

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:askia_db}
spring.datasource.username=${DB_USER:askia}
spring.datasource.password=${DB_PASSWORD:askia123}
spring.datasource.driver-class-name=org.postgresql.Driver

# O esquema do banco agora é responsabilidade do Flyway (src/main/resources/db/migration).
# validate: o Hibernate só CONFERE se entidades e tabelas batem; se não bater, a
# aplicação não sobe (melhor que corromper dados em silêncio).
spring.jpa.hibernate.ddl-auto=validate

# Banco que já existia (criado pelo ddl-auto=update): o Flyway o marca como versão 1
# sem rodar o V1, e aplica só as migrations novas. Banco vazio roda todas.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect