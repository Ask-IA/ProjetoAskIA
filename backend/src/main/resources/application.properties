spring.application.name=IA

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:askia_db}
spring.datasource.username=${DB_USER:askia}
spring.datasource.password=${DB_PASSWORD:askia123}
