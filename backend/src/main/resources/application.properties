spring.application.name=IA

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:askia_db}
spring.datasource.username=${DB_USER:askia}
spring.datasource.password=${DB_PASSWORD:askia123}
spring.datasource.driver-class-name=org.postgresql.Driver

# O esquema do banco é criado pelo próprio Postgres ao subir (scripts .sql da
# pasta db/ na raiz do projeto, montados em /docker-entrypoint-initdb.d do
# container). validate: o Hibernate só CONFERE se entidades e tabelas batem;
# se não bater, a aplicação não sobe (melhor que corromper dados em silêncio).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Cota diária de perguntas à IA, POR USUÁRIO. O dia vira à meia-noite no fuso abaixo.
# (O front tem a mesma constante em ask-ia.service.ts: COTA_DIARIA. Mantenha as duas iguais.)
app.ia.limite-diario=10
app.ia.fuso=America/Sao_Paulo

# URL pública do frontend: usada no CORS e para montar o link de redefinição
# de senha enviado por e-mail. Em produção, trocar via variável de ambiente.
app.frontend-url=${FRONTEND_URL:http://localhost:4200}

# ---- Cookie de sessão ----
# CSRF está desligado (SecurityConfig) porque a API só é usada pelo próprio
# frontend, nunca por formulário de terceiros — então quem segura o CSRF é o
# SameSite do cookie, não um token. Deixar isso implícito (default do Tomcat)
# é o que normalmente gera a vulnerabilidade; por isso fica explícito aqui:
#  - same-site=lax: cookie não vai em requisição disparada por outro site
#    (a defesa real contra CSRF, já que não há token). "Lax" e não "strict"
#    porque o link de "esqueci minha senha" abre o front numa navegação de
#    topo vinda do e-mail — "strict" quebraria esse fluxo.
#  - http-only=true: JavaScript nunca lê o cookie (defesa contra XSS roubar sessão).
#  - secure: desligado em dev (http://localhost) porque senão o navegador
#    descarta o cookie e o login para de funcionar. Em produção, sempre atrás
#    de HTTPS, troque COOKIE_SECURE=true no ambiente do servidor.
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# ---- IA (OpenAI OU Gemini, via Spring AI) ----
# Qual dos dois fica ativo é decidido em runtime por IaProviderEnvironmentPostProcessor
# (config/), a partir de qual key está preenchida no .env — não precisa trocar nada
# aqui quando trocar de provedor. As duas keys ficam só no .env (nunca commitadas).
# Sem NENHUMA key configurada, o backend ainda sobe — o endpoint /api/ia/perguntar
# é que falha, com mensagem clara (IaService).
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.openai.chat.temperature=0.4

spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.model=${GEMINI_MODEL:gemini-3.8-flash}
spring.ai.google.genai.chat.temperature=0.4

# Retry: o PADRÃO do Spring AI é até 10 tentativas com backoff exponencial que
# chega a 3 MINUTOS entre tentativas (2s -> 10s -> 50s -> 3min...) sempre que o
# provedor devolve erro transitório (rate limit, 5xx, timeout de rede). Isso
# ficava silencioso pro usuário: o nginx já tinha desistido com 504 em 60s
# muito antes do backend terminar de tentar. Reduzido para falhar rápido (poucos
# segundos) e cair no IaIndisponivelException, que o frontend já trata.
spring.ai.retry.max-attempts=2
spring.ai.retry.backoff.initial-interval=1s
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=5s

# ---- E-mail (Resend) — "esqueci minha senha" ----
app.resend.api-key=${RESEND_API_KEY:}
app.resend.remetente=${RESEND_FROM_EMAIL:onboarding@resend.dev}
